<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFinder - Senior Filter System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bg: #f8fafc;
            --white: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        /* --- CONTAINER DE FILTROS --- */
        .filter-wrapper {
            max-width: 1000px;
            margin: 0 auto 40px auto;
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-header h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        /* 1. BARRA DE BUSCA SENIOR */
        .search-container {
            position: relative;
            margin-bottom: 25px;
        }

        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .search-input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        /* 2. CHIPS DE FILTRO (Rápido e Mobile Friendly) */
        .chips-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none; /* Esconde scroll no Firefox */
        }

        .chips-container::-webkit-scrollbar { display: none; } /* Esconde scroll no Chrome */

        .filter-chip {
            white-space: nowrap;
            padding: 10px 18px;
            background: var(--bg);
            border: 1.5px solid #e2e8f0;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
        }

        /* 3. GRID DE FILTROS AVANÇADOS */
        .advanced-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .filter-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .filter-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1.5px solid #e2e8f0;
            background: var(--white);
            font-family: inherit;
            color: var(--text-main);
            cursor: pointer;
        }

        /* 4. RESULTADO COUNTER */
        .results-info {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 20px;
        }

        .results-info span {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="filter-wrapper">
        <div class="filter-header">
            <h2>Encontre o melhor para seu pet</h2>
            <button class="filter-chip" style="border:none; background:none; color:var(--primary)">Limpar filtros</button>
        </div>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="search-input" placeholder="Bairro, cidade ou nome do Pet Shop...">
        </div>

        <div class="chips-container">
            <div class="filter-chip active">
                <i class="fa-solid fa-clock"></i> Aberto Agora
            </div>
            <div class="filter-chip">
                <i class="fa-solid fa-star"></i> Melhor Avaliados (4.5+)
            </div>
            <div class="filter-chip">
                <i class="fa-solid fa-truck"></i> Com Delivery
            </div>
            <div class="filter-chip">
                <i class="fa-solid fa-scissors"></i> Banho e Tosa
            </div>
            <div class="filter-chip">
                <i class="fa-solid fa-stethoscope"></i> Veterinária 24h
            </div>
            <div class="filter-chip">
                <i class="fa-solid fa-car"></i> Estacionamento
            </div>
        </div>

        <div class="advanced-filters">
            <div class="filter-group">
                <label>Distância Máxima</label>
                <select class="filter-select">
                    <option>Qualquer distância</option>
                    <option>Até 2 km</option>
                    <option>Até 5 km</option>
                    <option>Até 10 km</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Faixa de Preço (Google Maps)</label>
                <select class="filter-select">
                    <option>Todos</option>
                    <option>$ - Econômico</option>
                    <option>$$ - Moderado</option>
                    <option>$$$ - Premium</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Ordenar Por</label>
                <select class="filter-select">
                    <option>Relevância</option>
                    <option>Mais Próximos</option>
                    <option>Melhor Avaliados</option>
                </select>
            </div>
        </div>

        <div class="results-info">
            Exibindo <span>12</span> pet shops encontrados em <span>São Paulo, SP</span>
        </div>
    </div>

    <script>
        // Lógica simples para alternar os chips (Interatividade Sênior)
        const chips = document.querySelectorAll('.filter-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('active');
            });
        });
    </script>

</body>
</html>
